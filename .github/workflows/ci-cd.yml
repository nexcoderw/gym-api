name: CI and production deployment

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gym-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify API
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out database package
        uses: actions/checkout@v4
        with:
          repository: nexcoderw/gym-db
          ref: main
          token: ${{ secrets.DB_REPOSITORY_READ_TOKEN }}
          path: db

      - name: Check out API
        uses: actions/checkout@v4
        with:
          path: api

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            api/package-lock.json

      - name: Build database dependency
        working-directory: db
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/gym_ci
        run: |
          npm ci
          npm run prisma:generate
          npm run build

      - name: Install locked API dependencies
        working-directory: api
        run: npm ci

      - name: Check formatting
        working-directory: api
        run: npm run format:check

      - name: Lint
        working-directory: api
        run: npm run lint

      - name: Type-check
        working-directory: api
        run: npm run typecheck

      - name: Run unit tests
        working-directory: api
        run: npm run test:unit

      - name: Run HTTP contract tests
        working-directory: api
        run: npm run test:e2e

      - name: Build API
        working-directory: api
        run: npm run build

  deploy:
    name: Deploy API
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment:
      name: production
      url: https://api.mucyora.rw/api/v1/health/live
    env:
      SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
      SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v4

      - name: Configure production SSH
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing PRODUCTION_SSH_HOST environment variable}"
          : "${SSH_USER:?Missing PRODUCTION_SSH_USER environment variable}"
          : "${SSH_PRIVATE_KEY:?Missing PRODUCTION_SSH_PRIVATE_KEY secret}"
          : "${SSH_KNOWN_HOSTS:?Missing PRODUCTION_SSH_KNOWN_HOSTS secret}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy exact API commit
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$GITHUB_SHA' '$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT'" \
            < scripts/deploy-production.sh

      - name: Remove ephemeral SSH material
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
